name: Android CI & Release

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up JDK 21
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@db19848a5fa7950289d3668fb053140cf3028d43 # v3.3.2

      - name: Set up Keystore for Build Validation
        run: |
          mkdir -p ~/.android ~/.config/.android
          keytool -genkeypair -alias androiddebugkey -keypass android -keystore ~/.android/debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          cp ~/.android/debug.keystore ~/.config/.android/debug.keystore

      - name: Run Unit Tests & Build Release/Debug APKs
        run: ./gradlew test assembleRelease assembleDebug

      - name: Prepare Named APKs
        run: |
          mkdir -p dist
          VERSION_TAG="${GITHUB_REF_NAME}"
          if [[ ! "$VERSION_TAG" =~ ^v[0-9] ]]; then
            RAW_VER=$(awk -F '"' '/versionName/ {print $2}' app/build.gradle.kts)
            VERSION_TAG="v${RAW_VER}"
          fi
          echo "Packaging version: $VERSION_TAG"
          cp app/build/outputs/apk/release/app-release.apk "dist/XHide-${VERSION_TAG}-release.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "dist/XHide-${VERSION_TAG}-debug.apk"

      - name: Upload XHide APK Artifacts
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: XHide-apks
          path: dist/*.apk

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download XHide APK Artifacts
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          name: XHide-apks
          path: dist

      - name: Publish GitHub Release on Tag
        uses: softprops/action-gh-release@c062e08bd532815e2082a85e87e3ef29c3e6d191 # v2.0.8
        with:
          files: dist/*.apk
          body_path: RELEASE_NOTES_DRAFT.md
          name: XHide ${{ github.ref_name }}
          generate_release_notes: false
